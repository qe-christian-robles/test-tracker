.defect-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:8px;display:grid;grid-template-columns:auto auto auto 1fr auto auto auto;gap:10px;align-items:center;font-size:13px}

<body>
<div class="toast-container" id="toastContainer"></div>
<header class="app-header">
  <div class="logo"><div class="logo-icon">AT</div><input type="text" id="dashTitle" value="" onchange="curDash().title=this.value;saveDash(meta.currentDashId);renderNav()" spellcheck="false" style="font-family:var(--font-mono);font-size:17px;font-weight:600;background:transparent;border:1px solid transparent;color:var(--text-primary);padding:4px 8px;border-radius:var(--radius);width:500px;max-width:50vw;cursor:text" onfocus="this.style.borderColor='var(--border-focus)';this.style.background='var(--bg-input)'" onblur="this.style.borderColor='transparent';this.style.background='transparent'"></div>
  <div class="header-actions"><select class="btn btn-sm" id="fontSelect" onchange="setFont(this.value)" style="padding:4px 8px;font-size:11px"><option value="'DM Sans',sans-serif">DM Sans</option><option value="'Inter',sans-serif">Inter</option><option value="'Source Sans 3',sans-serif">Source Sans</option><option value="system-ui,sans-serif">System</option></select><select class="btn btn-sm" id="fontSizeSelect" onchange="setFontScale(this.value)" style="padding:4px 8px;font-size:11px"><option value="0.9">Small</option><option value="1" selected>Medium</option><option value="1.1">Large</option><option value="1.2">XL</option></select><button class="btn btn-sm" id="themeToggle" onclick="toggleTheme()">☀ Light</button></div>
</header>
<div class="nav-bar">
  <label>Dashboard:</label><select id="dashSelect" onchange="switchDashboard(this.value)"></select><button class="btn btn-sm" onclick="createDashboard()">+ New</button><button class="btn btn-sm btn-danger" id="delDashBtn" onclick="deleteDashboard()">🗑</button>
  <div class="nav-sep"></div><label>View:</label><select id="viewSelect" onchange="switchView(this.value)"></select><button class="btn btn-sm" onclick="createProject()">+ Project</button><button class="btn btn-sm btn-danger" id="delProjBtn" onclick="deleteProject()">🗑</button>
  <div class="nav-sep"></div><button class="btn btn-sm" onclick="downloadTemplate()">⬇ CSV</button><label class="btn btn-sm btn-primary">📁 Import<input type="file" accept=".csv" onchange="handleCSVImport(event)" style="display:none"></label>
  <div style="margin-left:auto;display:flex;gap:6px"><button class="btn btn-sm" onclick="openBackupModal()">💾 Backup</button><label class="btn btn-sm">📂 Restore<input type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label><button class="btn btn-sm" onclick="exportPDF()">📄 PDF</button></div>
</div>
<main class="app-main"><div id="mainContent"></div></main>

<!-- MODALS -->
<div class="modal-overlay" id="confirmModal"><div class="modal"><h3 id="confirmTitle">Confirm</h3><p id="confirmMsg" style="color:var(--text-secondary);margin-bottom:16px"></p><div class="modal-actions"><button class="btn" onclick="closeModal('confirmModal')">Cancel</button><button class="btn btn-danger" id="confirmAction">Confirm</button></div></div></div>
<div class="modal-overlay" id="linkModal"><div class="modal"><h3>Link Test Cases</h3><p style="color:var(--text-secondary);margin-bottom:12px" id="linkReqLabel"></p><select id="linkTcSelect" style="width:100%;font-family:var(--font-sans);font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)"></select><div class="modal-actions"><button class="btn" onclick="closeModal('linkModal')">Cancel</button><button class="btn btn-primary" onclick="confirmLink()">Link</button></div></div></div>
<div class="modal-overlay" id="tcModal"><div class="modal modal-lg" id="tcModalContent"></div></div>
<div class="modal-overlay" id="backupModal"><div class="modal"><h3>Backup JSON</h3><p style="color:var(--text-secondary);margin-bottom:16px">Choose scope:</p><div style="display:flex;flex-direction:column;gap:12px"><button class="btn" onclick="exportDashJSON();closeModal('backupModal')">📊 Entire Dashboard (all projects)</button><button class="btn" id="backupProjBtn" onclick="exportProjJSON();closeModal('backupModal')">📁 Current Project Only</button></div><div class="modal-actions"><button class="btn" onclick="closeModal('backupModal')">Cancel</button></div></div></div>
<div class="modal-overlay" id="addTcModal"><div class="modal"><h3>Add Test Case</h3>
<div class="tc-modal-field"><label>TC ID</label><input id="atc_id" placeholder="TC-001"></div>
<div class="tc-modal-row"><div class="tc-modal-field"><label>Scenario</label><input id="atc_scenario"></div><div class="tc-modal-field"><label>Validation Area</label><input id="atc_area"></div></div>
<div class="tc-modal-field"><label>Expected Results</label><input id="atc_expected"></div>
<div class="tc-modal-row"><div class="tc-modal-field"><label>Type</label><select id="atc_type"><option>Smoke</option><option>Functional</option><option>Integrated</option><option>E2E</option></select></div><div class="tc-modal-field"><label>Priority</label><select id="atc_priority"><option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option></select></div></div>
<div class="modal-actions"><button class="btn" onclick="closeModal('addTcModal')">Cancel</button><button class="btn btn-primary" onclick="confirmAddTc()">Add</button></div></div></div>
<div class="modal-overlay" id="defectModal"><div class="modal"><h3>Log Defect</h3>
<div class="tc-modal-field"><label>Defect ID</label><input id="df_id" placeholder="DEF-001"></div>
<div class="tc-modal-field"><label>Title</label><input id="df_title"></div>
<div class="tc-modal-row"><div class="tc-modal-field"><label>Severity</label><select id="df_sev"><option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="tc-modal-field"><label>External Ref (Jira, ADO, etc.)</label><input id="df_ref" placeholder="JIRA-1234"></div></div>
<div class="tc-modal-field"><label>Description</label><textarea id="df_desc" style="min-height:60px"></textarea></div>
<input type="hidden" id="df_tcid">
<div class="modal-actions"><button class="btn" onclick="closeModal('defectModal')">Cancel</button><button class="btn btn-primary" onclick="confirmAddDefect()">Log Defect</button></div></div></div>
<div class="modal-overlay" id="defectViewModal"><div class="modal modal-lg" id="defectViewContent"></div></div>
<script>
const STATUSES=['Pass','Fail','Blocked','Todo','Build in Progress','Ready to Test','Test in Progress','Pending Input','Skipped','Deferred'];
const STATUS_COLORS={'Pass':'#22c55e','Fail':'#ef4444','Blocked':'#f97316','Todo':'#64748b','Build in Progress':'#06b6d4','Ready to Test':'#eab308','Test in Progress':'#06b6d4','Pending Input':'#ec4899','Skipped':'#8b5cf6','Deferred':'#8b5cf6'};
const PRIORITIES=['Critical','High','Medium','Low'];
const BLOCKING_REASONS=['Bug or Defect','Requirement Clarification','Development Incomplete','Environment','Test Data Issue','Access or Permission Issue','Third-Party Dependency'];
const SUB_STATUSES=['New','Open','Closed','Done'];
const SCRIPT_STATUSES=['Todo','In Progress','Done'];
const RISK_STATUSES=['New','Under Assessment','Open','Mitigated','Accepted'];
const RISK_CATS=['Technical','Environment','Resource','Schedule','Dependency','Scope','Data'];
const RSC={'New':'risk-new','Under Assessment':'risk-under-assessment','Open':'risk-open','Mitigated':'risk-mitigated','Accepted':'risk-accepted'};
const DEFECT_STATUSES=['New','Reported','In Progress','Fixed','Verified','Closed','Deferred'];
const DSC={'New':'ds-new','Reported':'ds-reported','In Progress':'ds-in-progress','Fixed':'ds-fixed','Verified':'ds-verified','Closed':'ds-closed','Deferred':'ds-deferred'};
const MK='att5_meta',DP='att5_d_',PP='att5_p_';
let meta={currentDashId:null,prefs:{theme:'dark',font:"'DM Sans',sans-serif",fontScale:'1'}};
let dashboards={},projects={},charts={},linkingReqIdx=-1;

// PERSISTENCE
function saveMeta(){try{localStorage.setItem(MK,JSON.stringify(meta))}catch(e){}}
function saveDash(id){try{localStorage.setItem(DP+id,JSON.stringify(dashboards[id]))}catch(e){}}
function saveProj(id){try{localStorage.setItem(PP+id,JSON.stringify(projects[id]))}catch(e){}}
function loadAll(){try{const m=localStorage.getItem(MK);if(m)meta=JSON.parse(m)}catch(e){}if(!meta.prefs)meta.prefs={theme:'dark',font:"'DM Sans',sans-serif",fontScale:'1'};dashboards={};projects={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(DP))try{dashboards[k.slice(DP.length)]=JSON.parse(localStorage.getItem(k))}catch(e){}if(k.startsWith(PP))try{projects[k.slice(PP.length)]=JSON.parse(localStorage.getItem(k))}catch(e){}}if(!Object.keys(dashboards).length){const id=gid();dashboards[id]={title:'My Dashboard',projectIds:[],logEntries:[],risks:[],currentView:'cumulative'};meta.currentDashId=id;saveDash(id);saveMeta()}if(!meta.currentDashId||!dashboards[meta.currentDashId])meta.currentDashId=Object.keys(dashboards)[0]}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function curDash(){return dashboards[meta.currentDashId]}
function curView(){return curDash()?.currentView||'cumulative'}
function curProj(){return curView()!=='cumulative'?projects[curView()]:null}
function allTCs(){const d=curDash();if(!d)return[];return d.projectIds.flatMap(pid=>(projects[pid]?.testCases||[]).map(tc=>({...tc,_pid:pid,_pt:projects[pid]?.title||pid})))}
function isExec(t){return['Pass','Fail','Skipped'].includes(t.status)||(['In Progress','Done'].includes(t.scriptStatus||'Todo')&&['Test in Progress','Blocked','Pass','Fail','Pending Input'].includes(t.status))}

// PREFS
function applyPrefs(){document.body.classList.toggle('light',meta.prefs.theme==='light');document.getElementById('themeToggle').innerHTML=meta.prefs.theme==='light'?'🌙 Dark':'☀ Light';document.documentElement.style.setProperty('--font-sans',meta.prefs.font);document.documentElement.style.setProperty('--font-scale',meta.prefs.fontScale);try{document.getElementById('fontSelect').value=meta.prefs.font;document.getElementById('fontSizeSelect').value=meta.prefs.fontScale}catch(e){}}
function toggleTheme(){meta.prefs.theme=meta.prefs.theme==='dark'?'light':'dark';saveMeta();applyPrefs()}
function setFont(v){meta.prefs.font=v;saveMeta();applyPrefs()}
function setFontScale(v){meta.prefs.fontScale=v;saveMeta();applyPrefs()}

// NAV
function renderNav(){const ds=document.getElementById('dashSelect');ds.innerHTML=Object.entries(dashboards).map(([id,d])=>`<option value="${id}" ${id===meta.currentDashId?'selected':''}>${esc(d.title)}</option>`).join('');document.getElementById('delDashBtn').style.display=Object.keys(dashboards).length>1?'':'none';const vs=document.getElementById('viewSelect');const d=curDash();vs.innerHTML=`<option value="cumulative">📊 Cumulative</option>`+(d?d.projectIds.map(pid=>`<option value="${pid}" ${d.currentView===pid?'selected':''}>${esc(projects[pid]?.title||pid)}</option>`).join(''):'');document.getElementById('delProjBtn').style.display=curView()!=='cumulative'?'':'none';document.getElementById('dashTitle').value=d?.title||''}
function switchDashboard(id){meta.currentDashId=id;saveMeta();curDash().currentView='cumulative';saveDash(id);renderNav();renderMain()}
function switchView(v){curDash().currentView=v;saveDash(meta.currentDashId);renderNav();renderMain()}
function createDashboard(){const t=prompt('Dashboard name:');if(!t)return;const id=gid();dashboards[id]={title:t,projectIds:[],logEntries:[],risks:[],currentView:'cumulative'};meta.currentDashId=id;saveDash(id);saveMeta();renderNav();renderMain();showToast('Dashboard created','success')}
function deleteDashboard(){if(Object.keys(dashboards).length<=1)return;if(!confirm('Delete "'+curDash().title+'"?'))return;curDash().projectIds.forEach(pid=>{delete projects[pid];localStorage.removeItem(PP+pid)});delete dashboards[meta.currentDashId];localStorage.removeItem(DP+meta.currentDashId);meta.currentDashId=Object.keys(dashboards)[0];saveMeta();renderNav();renderMain();showToast('Deleted','success')}
function createProject(){const t=prompt('Project name:');if(!t)return;const id=gid();projects[id]={title:t,testCases:[],logEntries:[],risks:[],requirements:[],defects:[],goal:''};curDash().projectIds.push(id);curDash().currentView=id;saveDash(meta.currentDashId);saveProj(id);renderNav();renderMain();showToast('Project created','success')}
function deleteProject(){const v=curView();if(v==='cumulative')return;if(!confirm('Delete "'+projects[v]?.title+'"?'))return;curDash().projectIds=curDash().projectIds.filter(id=>id!==v);curDash().currentView='cumulative';delete projects[v];localStorage.removeItem(PP+v);saveDash(meta.currentDashId);renderNav();renderMain();showToast('Deleted','success')}

// CSV & TEMPLATE
function handleCSVImport(e){const f=e.target.files[0];if(!f)return;if(curView()==='cumulative'){showToast('Select a project first','error');e.target.value='';return}const p=curProj();Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{const mapped=r.data.map(row=>{const k=Object.keys(row).map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));const v=Object.values(row);const o={};k.forEach((k,i)=>o[k]=(v[i]||'').trim());return o}).filter(r=>r.tc_id);if(!mapped.length){showToast('No valid rows','error');return}const ex={};p.testCases.forEach(t=>ex[t.tc_id]=t);mapped.forEach(row=>{if(!ex[row.tc_id])ex[row.tc_id]={tc_id:row.tc_id,validationArea:row.validation_area||'',scenarioName:row.scenario_name||'',expectedResults:row.expected_results||'',typeOfTest:row.type_of_test||'',priority:(row.priority&&PRIORITIES.includes(row.priority))?row.priority:'Medium',status:'Todo',blockingReason:'',blockingDetails:'',actualResults:'',tcDetails:'',scriptStatus:'Todo',subItems:[]}});p.testCases=Object.values(ex);saveProj(curView());renderMain();showToast(`Imported ${mapped.length} TCs`,'success')},error:()=>showToast('Parse failed','error')});e.target.value=''}
function downloadTemplate(){downloadFile('template.csv','TC_ID,Validation Area,Scenario Name,Expected Results,Type of Test,Priority\nTC-001,Happy Path,Valid login,Returns 200,Smoke,Critical','text/csv')}

// JSON BACKUP/RESTORE
function openBackupModal(){document.getElementById('backupProjBtn').style.display=curView()!=='cumulative'?'':'none';document.getElementById('backupModal').classList.add('open')}
function exportDashJSON(){const d=curDash(),payload={_type:'dashboard',dashboard:{...d},projects:{}};d.projectIds.forEach(pid=>{payload.projects[pid]=projects[pid]});downloadFile(`${d.title}_dashboard.json`,JSON.stringify(payload,null,2),'application/json');showToast('Dashboard exported','success')}
function exportProjJSON(){const p=curProj();if(!p)return;downloadFile(`${p.title}_project.json`,JSON.stringify({_type:'project',project:{...p}},null,2),'application/json');showToast('Project exported','success')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{const data=JSON.parse(ev.target.result);if(data._type==='dashboard'||data.dashboard){const id=gid(),db={...data.dashboard,projectIds:[]};Object.entries(data.projects||{}).forEach(([,proj])=>{const np=gid();projects[np]=proj;saveProj(np);db.projectIds.push(np)});db.currentView='cumulative';dashboards[id]=db;meta.currentDashId=id;saveDash(id);saveMeta();renderNav();renderMain();showToast('Dashboard restored','success')}else if(data._type==='project'||data.project){const proj=data.project||data;const pid=gid();projects[pid]=proj;saveProj(pid);curDash().projectIds.push(pid);curDash().currentView=pid;saveDash(meta.currentDashId);renderNav();renderMain();showToast('Project restored','success')}else showToast('Unknown format','error')}catch(err){showToast('Parse failed','error')}};r.readAsText(f);e.target.value=''}

// MANUAL TC
function openAddTcModal(){if(curView()==='cumulative'){showToast('Select a project','error');return}document.querySelectorAll('#addTcModal input').forEach(i=>i.value='');document.getElementById('addTcModal').classList.add('open')}
function confirmAddTc(){const p=curProj();if(!p)return;const id=document.getElementById('atc_id').value.trim();if(!id){showToast('TC ID required','error');return}if(p.testCases.find(t=>t.tc_id===id)){showToast('ID exists','error');return}p.testCases.push({tc_id:id,validationArea:document.getElementById('atc_area').value.trim(),scenarioName:document.getElementById('atc_scenario').value.trim(),expectedResults:document.getElementById('atc_expected').value.trim(),typeOfTest:document.getElementById('atc_type').value,priority:document.getElementById('atc_priority').value,status:'Todo',blockingReason:'',blockingDetails:'',actualResults:'',tcDetails:'',scriptStatus:'Todo',subItems:[]});saveProj(curView());closeModal('addTcModal');renderMain();showToast('TC added','success')}

// DEFECT
function openDefectModal(tcId){document.getElementById('df_id').value='DEF-'+(Date.now()%10000);document.getElementById('df_title').value='';document.getElementById('df_desc').value='';document.getElementById('df_ref').value='';document.getElementById('df_tcid').value=tcId||'';document.getElementById('defectModal').classList.add('open')}
function confirmAddDefect(){const p=curProj();if(!p)return;const id=document.getElementById('df_id').value.trim(),title=document.getElementById('df_title').value.trim();if(!id||!title){showToast('ID and title required','error');return}if(!p.defects)p.defects=[];p.defects.push({id,title,severity:document.getElementById('df_sev').value,status:'New',linkedTC:document.getElementById('df_tcid').value,externalRef:document.getElementById('df_ref').value.trim(),description:document.getElementById('df_desc').value.trim(),date:new Date().toISOString()});saveProj(curView());closeModal('defectModal');renderMain();showToast('Defect logged','success')}

// ═══════ RENDER ═══════
function renderMain(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};const mc=document.getElementById('mainContent');curView()==='cumulative'?renderCumulative(mc):renderProject(mc)}

// ═══════ CUMULATIVE ═══════
function renderCumulative(mc){const d=curDash(),all=allTCs(),n=all.length;
if(!d.projectIds.length){mc.innerHTML='<div class="empty-state"><h2>No Projects</h2><p>Create a project to start.</p><div class="actions"><button class="btn btn-primary" onclick="createProject()">+ Project</button></div></div>';return}
const pa=all.filter(t=>t.status==='Pass').length,fa=all.filter(t=>t.status==='Fail').length,bl=all.filter(t=>t.status==='Blocked').length,pi=all.filter(t=>t.status==='Pending Input').length,ex=all.filter(isExec).length,pr=ex>0?Math.round(pa/ex*100):0;
const oi=all.reduce((s,t)=>s+(t.subItems||[]).filter(si=>!['Closed','Done'].includes(si.status)).length,0);
const allDefects=d.projectIds.flatMap(pid=>(projects[pid]?.defects||[]).map(df=>({...df,_pt:projects[pid]?.title||pid,_pid:pid})));
const openDef=allDefects.filter(df=>!['Verified','Closed'].includes(df.status)).length;
const blockedTCs=all.filter(t=>t.status==='Blocked');
let h=`<div class="kpi-grid">
<div class="kpi-card"><div class="kpi-label">Total TCs</div><div class="kpi-value" style="color:var(--accent)">${n}</div><div class="kpi-sub">${d.projectIds.length} projects</div></div>
<div class="kpi-card"><div class="kpi-label">Passed</div><div class="kpi-value" style="color:var(--success)">${pa}</div><div class="kpi-sub">${pr}% rate</div></div>
<div class="kpi-card"><div class="kpi-label">Failed</div><div class="kpi-value" style="color:var(--fail)">${fa}</div></div>
<div class="kpi-card"><div class="kpi-label">Blocked</div><div class="kpi-value" style="color:var(--blocked)">${bl}</div></div>
<div class="kpi-card"><div class="kpi-label">Executed</div><div class="kpi-value" style="color:var(--warning)">${ex}</div><div class="kpi-sub">${n?Math.round(ex/n*100):0}%</div></div>
<div class="kpi-card"><div class="kpi-label">Open Items</div><div class="kpi-value" style="color:var(--deferred)">${oi}</div></div>
<div class="kpi-card"><div class="kpi-label">Open Defects</div><div class="kpi-value" style="color:var(--fail)">${openDef}</div><div class="kpi-sub">${allDefects.length} total</div></div>
<div class="kpi-card"><div class="kpi-label">Script Done</div><div class="kpi-value" style="color:var(--info)">${all.filter(t=>t.scriptStatus==='Done').length}</div></div>
</div>`;
// Charts - 4 panels
h+=`<div class="chart-grid"><div class="chart-card"><h3>Status Distribution</h3><div class="chart-container"><canvas id="cS"></canvas></div></div><div class="chart-card"><h3>Priority Distribution</h3><div class="chart-container"><canvas id="cPri"></canvas></div></div><div class="chart-card"><h3>Execution Progress</h3><div class="chart-container"><canvas id="cP"></canvas></div></div><div class="chart-card"><h3>Blocking Reasons</h3><div class="chart-container"><canvas id="cBR"></canvas></div></div></div>`;
// UNIFIED Updates
h+=`<div class="section-header"><h2>Updates & Accomplishments</h2></div><div class="log-form no-pdf"><select id="dLT"><option>Update</option><option>Accomplishment</option></select><input id="dLX" placeholder="Add an update..." style="width:100%" onkeydown="if(event.key==='Enter')addUnifiedLog()"><button class="btn btn-sm btn-primary" onclick="addUnifiedLog()">Add</button></div>`;
h+=`<div class="filters-bar no-pdf"><select class="filter-select" id="cumLogSrc" onchange="renderUnifiedLogs()"><option value="">All Sources</option><option value="_dash">Dashboard Level</option>${d.projectIds.map(pid=>`<option value="${pid}">${esc(projects[pid]?.title)}</option>`).join('')}</select><select class="filter-select" id="cumLogTF" onchange="renderUnifiedLogs()"><option value="">All Types</option><option>Update</option><option>Accomplishment</option></select></div><div id="uLL"></div>`;
// UNIFIED Risks
h+=`<div class="section-header"><h2>Risk Register</h2></div><div style="display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:end;margin-bottom:12px" class="no-pdf"><input id="dRT" placeholder="Risk description..." style="font-size:13px;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)"><select id="dRC" style="font-size:12px;padding:7px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)">${RISK_CATS.map(c=>`<option>${c}</option>`).join('')}<option>Other</option></select><select id="dRS" style="font-size:12px;padding:7px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)"><option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option></select><input id="dRO" placeholder="Owner" style="width:100px;font-size:13px;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)"><button class="btn btn-sm btn-primary" onclick="addUnifiedRisk()">Add</button></div>`;
h+=`<div class="filters-bar no-pdf"><select class="filter-select" id="cumRSrc" onchange="renderUnifiedRisks()"><option value="">All Sources</option><option value="_dash">Dashboard Level</option>${d.projectIds.map(pid=>`<option value="${pid}">${esc(projects[pid]?.title)}</option>`).join('')}</select><select class="filter-select" id="cumRCF" onchange="renderUnifiedRisks()"><option value="">All Categories</option>${RISK_CATS.map(c=>`<option>${c}</option>`).join('')}<option>Other</option></select><select class="filter-select" id="cumRSF" onchange="renderUnifiedRisks()"><option value="">All Statuses</option>${RISK_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div><div id="uRL"></div>`;
// Blockers list
h+=`<div class="section-header"><h2>Blockers <span class="count">${blockedTCs.length}</span></h2></div><div id="cumBlockList"></div>`;
// Per-project breakdown
h+=`<div class="section-header"><h2>Per-Project Breakdown</h2></div>`;
d.projectIds.forEach(pid=>{const proj=projects[pid];if(!proj)return;const tc=proj.testCases||[],pn=tc.length,pp=tc.filter(t=>t.status==='Pass').length,pf=tc.filter(t=>t.status==='Fail').length,pb=tc.filter(t=>t.status==='Blocked').length,pe=tc.filter(isExec).length;

// UNIFIED LOGS (dashboard + all projects merged)
function addUnifiedLog(){const d=curDash(),t=document.getElementById('dLT').value,x=document.getElementById('dLX').value.trim();if(!x)return;if(!d.logEntries)d.logEntries=[];d.logEntries.unshift({type:t,text:x,date:new Date().toISOString()});document.getElementById('dLX').value='';saveDash(meta.currentDashId);renderUnifiedLogs()}

// REQUIREMENTS
function addReq(){const p=curProj();if(!p)return;const id=document.getElementById('rqI').value.trim(),d=document.getElementById('rqD').value.trim(),ref=document.getElementById('rqR')?.value?.trim()||'';if(!id||!d){showToast('ID and description required','error');return}if(!p.requirements)p.requirements=[];if(p.requirements.find(r=>r.id===id)){showToast('ID exists','error');return}p.requirements.push({id,description:d,reference:ref,linkedTCs:[]});document.getElementById('rqI').value='';document.getElementById('rqD').value='';if(document.getElementById('rqR'))document.getElementById('rqR').value='';saveProj(curView());renderReqs()}
function renderReqs(){const p=curProj();if(!p)return;if(!p.requirements)p.requirements=[];const cn=document.getElementById('rqC');if(cn)cn.textContent=p.requirements.length;const el=document.getElementById('rqL');if(!el)return;if(!p.requirements.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-muted)">No requirements.</div>';return}el.innerHTML=p.requirements.map((r,i)=>{const cov=getReqCovP(r,p),cc=cov==='Covered'?'coverage-covered':cov==='Missing'?'coverage-missing':'coverage-at-risk';return`<div class="req-card"><div class="req-header"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="req-id">${esc(r.id)}</span><span class="coverage-badge ${cc}">${cov}</span>${r.reference?`<span style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">ref: ${esc(r.reference)}</span>`:''}</div><div style="display:flex;gap:6px"><button class="edit-toggle no-pdf" onclick="const n=prompt('Edit description:',curProj().requirements[${i}].description);if(n!==null){curProj().requirements[${i}].description=n;saveProj(curView());renderReqs()}">✏</button><button class="btn btn-sm no-pdf" onclick="openLinkM(${i})">+ Link</button><button class="btn btn-sm btn-ghost no-pdf" onclick="curProj().requirements.splice(${i},1);saveProj(curView());renderReqs()" style="color:var(--text-muted)">✕</button></div></div><div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">${esc(r.description)}</div><div class="req-links">${r.linkedTCs.length?r.linkedTCs.map(tid=>{const f=p.testCases.find(t=>t.tc_id===tid),ti=f?p.testCases.indexOf(f):-1,si=f?'status-'+f.status.toLowerCase().replace(/\s+/g,'-'):'';return`<span class="req-link-chip"><span class="status-badge ${si}" style="padding:1px 6px;font-size:10px;cursor:pointer" onclick="openTcModal2(${ti})">${esc(tid)}</span><span class="remove-link no-pdf" onclick="curProj().requirements[${i}].linkedTCs=curProj().requirements[${i}].linkedTCs.filter(t=>t!=='${esc(tid)}');saveProj(curView());renderReqs()">✕</span></span>`}).join(''):'<span style="font-size:12px;color:var(--text-muted);font-style:italic">None</span>'}</div></div>`}).join('')}
function openLinkM(i){linkingReqIdx=i;const r=curProj().requirements[i];document.getElementById('linkReqLabel').textContent=r.id+' — '+r.description;const sel=document.getElementById('linkTcSelect'),av=curProj().testCases.filter(tc=>!r.linkedTCs.includes(tc.tc_id));sel.innerHTML=av.length?av.map(tc=>`<option value="${tc.tc_id}">${tc.tc_id} — ${tc.scenarioName}</option>`).join(''):'<option value="">None</option>';document.getElementById('linkModal').classList.add('open')}
function confirmLink(){const v=document.getElementById('linkTcSelect').value;if(!v){closeModal('linkModal');return}curProj().requirements[linkingReqIdx].linkedTCs.push(v);saveProj(curView());renderReqs();closeModal('linkModal')}

// TC MODAL
function openTcModal2(i){const p=curProj(),tc=p.testCases[i];const m=document.getElementById('tcModalContent');m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3 style="margin:0">${esc(tc.tc_id)}</h3><button class="btn btn-sm btn-ghost" onclick="closeModal('tcModal');renderMain()" style="font-size:18px;padding:4px 8px">✕</button></div><div class="tc-modal-row"><div class="tc-modal-field"><label>Scenario</label><input value="${esc(tc.scenarioName)}" onchange="puf(${i},'scenarioName',this.value)"></div><div class="tc-modal-field"><label>Area</label><input value="${esc(tc.validationArea)}" onchange="puf(${i},'validationArea',this.value)"></div></div><div class="tc-modal-row"><div class="tc-modal-field"><label>Status</label><select onchange="pUS(${i},this.value);openTcModal2(${i})" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)">${STATUSES.map(s=>`<option ${s===tc.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="tc-modal-field"><label>Priority</label><select onchange="puf(${i},'priority',this.value)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)">${PRIORITIES.map(p=>`<option ${p===(tc.priority||'Medium')?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="tc-modal-row"><div class="tc-modal-field"><label>Expected</label><input value="${esc(tc.expectedResults)}" onchange="puf(${i},'expectedResults',this.value)"></div><div class="tc-modal-field"><label>Script</label><select onchange="puf(${i},'scriptStatus',this.value)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)">${SCRIPT_STATUSES.map(s=>`<option ${s===(tc.scriptStatus||'Todo')?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="tc-modal-field"><label>Actual Results</label><textarea onchange="puf(${i},'actualResults',this.value)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);resize:vertical;min-height:50px">${esc(tc.actualResults||'')}</textarea></div>${tc.status==='Blocked'?`<div style="padding:12px;background:var(--blocked-bg);border:1px solid rgba(249,115,22,.3);border-radius:var(--radius);margin-bottom:14px"><label style="font-size:11px;font-weight:600;color:var(--blocked);display:block;margin-bottom:6px">BLOCKING REASON</label><select onchange="puf(${i},'blockingReason',this.value)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid rgba(249,115,22,.3);background:var(--bg-input);color:var(--text-primary);margin-bottom:8px"><option value="">— Select —</option>${BLOCKING_REASONS.map(r=>`<option ${tc.blockingReason===r?'selected':''}>${r}</option>`).join('')}</select><label style="font-size:11px;font-weight:600;color:var(--blocked);display:block;margin-bottom:6px">BLOCKING DETAILS</label><textarea onchange="puf(${i},'blockingDetails',this.value)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid rgba(249,115,22,.3);background:var(--bg-input);color:var(--text-primary);resize:vertical;min-height:40px">${esc(tc.blockingDetails||'')}</textarea></div>`:''}<div class="tc-modal-field"><label>Linked Defects</label>${(p.defects||[]).filter(d=>d.linkedTC===tc.tc_id).length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${(p.defects||[]).filter(d=>d.linkedTC===tc.tc_id).map(d=>{const di=(p.defects||[]).indexOf(d);return`<span style="font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:4px;background:var(--fail-bg);color:var(--fail);border:1px solid rgba(239,68,68,.3);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px" onclick="closeModal('tcModal');openDefectView(${di})">${esc(d.id)} — ${esc(d.status)}</span>`}).join('')}</div>`:'<span style="font-size:12px;color:var(--text-muted)">None</span>'}</div>`;document.getElementById('tcModal').classList.add('open')}

// DEFECT VIEW MODAL

function openDefectViewCross(pid,defIdx){const prev=curView();curDash().currentView=pid;const p=projects[pid];if(!p||!p.defects||!p.defects[defIdx])return;_renderDefectViewModal(p,defIdx,pid,true)}
function _renderDefectViewModal(p,defIdx,pid,isCross){
const df=p.defects[defIdx];const refDisplay=df.externalRef?shortLink(df.externalRef):'';const isUrl=df.externalRef&&(df.externalRef.startsWith('http')||df.externalRef.startsWith('//'));
const closeAction=isCross?`closeModal('defectViewModal');curDash().currentView='cumulative';saveDash(meta.currentDashId);renderMain()`:`closeModal('defectViewModal');renderMain()`;
const saveCmd=`saveProj('${pid}')`;
const m=document.getElementById('defectViewContent');
m.innerHTML=`<div id="dfv-wrap">
<div class="edit-view">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3 style="margin:0;color:var(--fail)">${esc(df.id)}</h3><div style="display:flex;gap:6px"><button class="edit-toggle" onclick="document.getElementById('dfv-wrap').classList.add('editing')" style="font-size:16px">✏</button><button class="btn btn-sm btn-ghost" onclick="${closeAction}" style="font-size:18px;padding:4px 8px">✕</button></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
<div><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Title</span><span style="font-size:14px">${esc(df.title)}</span></div>
<div><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Status</span><span class="defect-status ${DSC[df.status]||'ds-new'}">${esc(df.status)}</span></div>
<div><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Severity</span><span class="priority-badge priority-${df.severity.toLowerCase()}">${esc(df.severity)}</span></div>
<div><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Linked Test Case</span>${df.linkedTC?`<span class="td-id" onclick="closeModal('defectViewModal');${isCross?`openTcCross('${pid}',projects['${pid}'].testCases.findIndex(t=>t.tc_id==='${esc(df.linkedTC)}'))`:`const ti=curProj().testCases.findIndex(t=>t.tc_id==='${esc(df.linkedTC)}');if(ti>=0)openTcModal2(ti)`}">${esc(df.linkedTC)}</span>`:'<span style="font-size:12px;color:var(--text-muted)">None</span>'}</div>
<div><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">External Reference</span>${isUrl?`<a href="${esc(df.externalRef)}" target="_blank" rel="noopener" style="font-family:var(--font-mono);font-size:13px;color:var(--accent);text-decoration:underline">${esc(refDisplay.toUpperCase())}</a>`:(df.externalRef?`<span style="font-size:13px">${esc(df.externalRef)}</span>`:'<span style="font-size:12px;color:var(--text-muted)">None</span>')}</div>
<div><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Date Logged</span><span style="font-size:13px;font-family:var(--font-mono)">${df.date?new Date(df.date).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'-'}</span></div>
</div>
${df.description?`<div style="margin-bottom:16px"><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px">Description</span><div style="font-size:13px;color:var(--text-secondary);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;white-space:pre-wrap">${esc(df.description)}</div></div>`:''}
</div>
<div class="edit-form">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3 style="margin:0;color:var(--fail)">${esc(df.id)} — Edit</h3><button class="btn btn-sm btn-ghost" onclick="${closeAction}" style="font-size:18px;padding:4px 8px">✕</button></div>
<div class="tc-modal-field"><label>Title</label><input value="${esc(df.title)}" onchange="projects['${pid}'].defects[${defIdx}].title=this.value;${saveCmd}" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)"></div>
<div class="tc-modal-row"><div class="tc-modal-field"><label>Severity</label><select onchange="projects['${pid}'].defects[${defIdx}].severity=this.value;${saveCmd}" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)">${PRIORITIES.map(pr=>`<option ${df.severity===pr?'selected':''}>${pr}</option>`).join('')}</select></div><div class="tc-modal-field"><label>Status</label><select onchange="projects['${pid}'].defects[${defIdx}].status=this.value;${saveCmd}" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)">${DEFECT_STATUSES.map(s=>`<option ${df.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
<div class="tc-modal-field"><label>External Reference (Link)</label><input value="${esc(df.externalRef||'')}" onchange="projects['${pid}'].defects[${defIdx}].externalRef=this.value;${saveCmd}" placeholder="https://jira.com/browse/BUG-001" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)"></div>
<div class="tc-modal-field"><label>Description</label><textarea onchange="projects['${pid}'].defects[${defIdx}].description=this.value;${saveCmd}" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary);resize:vertical;min-height:60px">${esc(df.description||'')}</textarea></div>
<div class="tc-modal-field"><label>Linked Test Case</label><select onchange="projects['${pid}'].defects[${defIdx}].linkedTC=this.value;${saveCmd}" style="width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary)"><option value="">None</option>${p.testCases.map(tc=>`<option value="${tc.tc_id}" ${df.linkedTC===tc.tc_id?'selected':''}>${tc.tc_id} — ${tc.scenarioName}</option>`).join('')}</select></div>
<div style="text-align:right;margin-top:12px"><button class="btn btn-primary" onclick="document.getElementById('dfv-wrap').classList.remove('editing');${saveCmd};_renderDefectViewModal(projects['${pid}'],${defIdx},'${pid}',${isCross})">Done</button></div>
</div></div>`;
document.getElementById('defectViewModal').classList.add('open')}

// CSV & RESET
function exportProjCSV(){const p=curProj();if(!p)return;const h=['TC_ID','Area','Scenario','Expected','Type','Priority','Status','Script'];const rows=p.testCases.map(tc=>[tc.tc_id,tc.validationArea,tc.scenarioName,tc.expectedResults,tc.typeOfTest,tc.priority||'Medium',tc.status,tc.scriptStatus||'Todo']);downloadFile(`${p.title}.csv`,Papa.unparse({fields:h,data:rows}),'text/csv');showToast('Exported','success')}
function resetProj(){if(!confirm('Clear all data?'))return;const p=curProj();p.testCases=[];p.logEntries=[];p.risks=[];p.requirements=[];p.defects=[];saveProj(curView());renderMain();showToast('Reset','success')}

// PDF EXPORT
async function exportPDF(){showToast('Generating PDF...','success');
const chartSnaps={};document.querySelectorAll('#mainContent canvas').forEach(c=>{try{chartSnaps[c.id]=c.toDataURL('image/png')}catch(e){}});
let clone=document.getElementById('mainContent').cloneNode(true);clone.id='pdfClone';
clone.querySelectorAll('canvas').forEach(c=>{const src=chartSnaps[c.id];if(src){const img=document.createElement('img');img.src=src;img.style.cssText='width:100%;height:auto;display:block';c.parentNode.replaceChild(img,c)}});
// Make all tab content visible
clone.querySelectorAll('.tab-content').forEach(c=>c.style.display='block');
document.body.appendChild(clone);await new Promise(r=>setTimeout(r,500));
try{
  // Render entire clone as one continuous image
  const fullCanvas=await html2canvas(clone,{scale:1.5,useCORS:true,backgroundColor:'#ffffff',logging:false,width:1100,windowWidth:1100});
  const{jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const pw=pdf.internal.pageSize.getWidth()-16,ph=pdf.internal.pageSize.getHeight()-16;
  const imgW=pw,imgH=fullCanvas.height*imgW/fullCanvas.width;
  const totalPages=Math.ceil(imgH/ph);
  for(let p=0;p<totalPages;p++){
    if(p>0)pdf.addPage();
    const srcY=p*(fullCanvas.height/totalPages),srcH=fullCanvas.height/totalPages;
    const tmp=document.createElement('canvas');tmp.width=fullCanvas.width;tmp.height=srcH;
    tmp.getContext('2d').drawImage(fullCanvas,0,srcY,fullCanvas.width,srcH,0,0,fullCanvas.width,srcH);
    pdf.addImage(tmp.toDataURL('image/jpeg',.92),'JPEG',8,8,imgW,Math.min(imgH/totalPages,ph));
  }
  pdf.save(`${curDash().title}_${new Date().toISOString().slice(0,10)}.pdf`);
  showToast('PDF exported!','success');
}catch(e){console.error(e);showToast('PDF failed','error')}
clone.remove()}

// TABS & UTILS
function stab(t,b){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');b.classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shortLink(url){if(!url)return'';try{const u=new URL(url);const parts=u.pathname.split('/').filter(Boolean);return parts[parts.length-1]||u.hostname}catch(e){return url.length>30?url.substring(url.lastIndexOf('/')+1)||url:url}}
function downloadFile(n,c,t){const b=new Blob([c],{type:t});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}
function showToast(m,t){const c=document.getElementById('toastContainer');const e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=`${t==='success'?'✓':'✕'} ${m}`;c.appendChild(e);setTimeout(()=>e.remove(),3500)}

// INIT
loadAll();applyPrefs();renderNav();renderMain();
</script>
